name: Release

# Started by ./release.sh <version>, which checks the version and the repo state first.
# ./release.sh <version> --local runs the same build and publish steps on your machine instead
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the "v" prefix, e.g. 0.1.2'
        required: true

run-name: Release ${{ inputs.version }}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  HYPRMAC_VERBOSE_BUILD: 1

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version must look like 0.1.2, got '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Same toolchain setup as build.yml
      - run: ./.github/gh-actions-runner-xcode-select.sh
      - run: brew install bash fish xcbeautify
      - run: HOMEBREW_DISABLE_LOAD_FORMULA=1 brew update # Needed for swiftly :(
      - run: brew install swiftly
      - run: swiftly init --skip-install --assume-yes --verbose && swiftly install # Installs the version from .swift-version
      - run: swiftly run swift --version
      # Restores the tools cached by build.yml on main: complgen (cargo, ~50 s), the asciidoctor gems...
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-macos-26-${{ hashFiles('script/install-dep.sh', 'Gemfile', 'Gemfile.lock') }}

      # The same self-signed certificate as `release.sh --local`. macOS ties the Accessibility and Input Monitoring
      # permissions to it, so they survive updates. An ad-hoc signature changed with every build
      - name: Import the code signing certificate
        env:
          P12: ${{ secrets.HYPRMAC_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.HYPRMAC_CODESIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/codesign.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/codesign.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the key without a UI prompt
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/codesign.p12"

      # build-release.sh signs the app and the CLI with hyprmac-codesign-certificate, validate-release-binaries.sh checks them
      - run: ./build-release.sh --build-version "$VERSION"

      - name: cat ./.release/xcodebuild.log
        if: ${{ failure() }}
        run: 'if test -f ./.release/xcodebuild.log; then cat ./.release/xcodebuild.log; fi'

      - name: Publish the release and the Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          HYPRMAC_TAP_REMOTE: git@github.com:NovaisVictor/homebrew-tap.git
          HYPRMAC_TAP_AUTHOR_NAME: github-actions[bot]
          HYPRMAC_TAP_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          ./script/publish-release.sh "$VERSION" ".release/HyprMac-$VERSION.zip"
