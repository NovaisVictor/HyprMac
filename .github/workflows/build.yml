name: build

on:
  push:
    branches:
      - 'main'
      - 'rr/**' # "rr" stands for "remote run"
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # every day at 00:00
  workflow_call: # Allows other workflows to reuse this workflow as a job
  workflow_dispatch: # Allows running this workflow manually from the Actions tab or via 'gh workflow run'

# A newer push makes the running checks of the same ref obsolete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HYPRMAC_VERBOSE_BUILD: 1

jobs:

  # Only the latest macOS: the release build runs in release.yml, on every tag.
  # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
  build-debug:
    name: build-debug
    runs-on: macos-26
    steps:
      - run: env # Debug
      - uses: actions/checkout@v6
      - run: ./.github/gh-actions-runner-xcode-select.sh
      - run: brew install bash
      - run: HOMEBREW_DISABLE_LOAD_FORMULA=1 brew update # Needed for swiftly :(
      - run: brew install swiftly
      - run: swiftly init --skip-install --assume-yes --verbose && swiftly install
      - run: swiftly run swift --version
      # Tools that install-dep.sh downloads or compiles (swiftlint, swiftformat, periphery, xcodegen, gems...)
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-macos-26-${{ hashFiles('script/install-dep.sh', 'Gemfile', 'Gemfile.lock') }}
      # Installs every tool, complgen included, so the cache saved by main also serves release.yml
      # (tag runs can restore the caches of the default branch)
      - run: ./script/install-dep.sh --all
      # test.sh runs build-debug.sh itself, with -warnings-as-errors
      - run: ./test.sh
