# Xcode project configuration. Managed by https://github.com/yonaskolb/XcodeGen
# Xcode is only used to build the release App Bundle. Debug builds only use Swift Package Manager

name: HyprMac

packages:
  HyprMacPackage:
    path: hyprmac-package-symlink

configs:
  Debug: debug
  Release: release

# https://developer.apple.com/documentation/xcode/build-settings-reference
settings:
  base:
    TOOLCHAINS: ${XCODEGEN_TOOLCHAINS}
    SWIFT_VERSION: ${XCODEGEN_SWIFT_VERSION}
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.1.0
    # https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/LaunchServicesKeys.html#//apple_ref/doc/uid/20001431-108256
    # Specifies whether the app runs as an agent app. If this key is set to YES, Launch Services runs the app as an agent app.
    # Agent apps do not appear in the Dock or in the Force Quit window (cmd-opt-esc)
    INFOPLIST_KEY_LSUIElement: YES
    HYPRMAC_CODE_SIGN_IDENTITY: hyprmac-codesign-certificate
    CODE_SIGN_IDENTITY: $(HYPRMAC_CODE_SIGN_IDENTITY)

targets:
  HyprMac:
    type: application
    platform: macOS
    deploymentTarget: ${XCODEGEN_DEPLOYMENT_TARGET}
    sources:
      - "../Sources/HyprMacApp"
      - "../resources"
      - "../docs/config-examples/default-config.toml"
    dependencies:
      - package: HyprMacPackage
        product: AppBundle
    settings:
      configs:
        Debug:
          PRODUCT_NAME: HyprMac-Debug
          PRODUCT_BUNDLE_IDENTIFIER: com.victornovais.HyprMac.debug
        Release:
          PRODUCT_NAME: HyprMac
          PRODUCT_BUNDLE_IDENTIFIER: com.victornovais.HyprMac
          SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
          GCC_TREAT_WARNINGS_AS_ERRORS: YES
          OTHER_LDFLAGS: $(inherited) $(HYPRMAC_BUILD_INFO_LDFLAGS)
    entitlements:
      path: ../resources/HyprMac.entitlements
      properties:
        # Accessibility API doesn't work in sandboxed apps
        com.apple.security.app-sandbox: false
